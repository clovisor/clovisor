// Clovisor's copy (milestone 7.5) of gVisor's pkg/sentry/seccheck/points/container.proto
// at release-20261102.0, the runtime Substrate's default SandboxConfig pins.
// Changed only: go_package added, and the import made relative.

syntax = "proto3";

package gvisor.container;

option go_package = "github.com/clovisor/clovisor/libclovisor/gvisorpoints";

import "common.proto";

message Start {
  gvisor.common.ContextData context_data = 1;
  string id = 2;
  string cwd = 3;
  repeated string args = 4;
  repeated string env = 5;
  // Set to true when TTY is enabled (e.g. -t docker flag).
  bool terminal = 6;
}
