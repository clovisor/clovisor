# Clovisor as the additional ext_proc of Agent Substrate's egress gateway
# (milestone 7.4). Install Substrate with
#   --experimental-additional-egress-extproc-service=clovisor-system/clovisor:9443
# and give this ServiceAccount read access to Actors (a global viewer in
# Substrate's access policy): see docs/operator-guide.md, Agent Substrate.
#
# Substrate's Envoy calls Clovisor over TLS 1.3, verifying the servicedns
# certificate for clovisor.clovisor-system.svc, with its podidentity client
# certificate, which Clovisor admits only for atenet-egress. Clovisor reaches
# Substrate's API with its own podidentity certificate.
apiVersion: v1
kind: Namespace
metadata:
  name: clovisor-system
  labels:
    # Substrate's NetworkPolicy admits Substrate's API clients by this label.
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clovisor
  namespace: clovisor-system
automountServiceAccountToken: false
---
# The Service exists before the pod: the servicedns signer names a pod's
# certificate after the Services that select it.
apiVersion: v1
kind: Service
metadata:
  name: clovisor
  namespace: clovisor-system
spec:
  selector:
    app: clovisor
  ports:
  - name: extproc
    port: 9443
    targetPort: extproc
  # The sandbox sinks' points (milestone 7.5; sandbox-audit.yaml).
  - name: sandbox
    port: 9444
    targetPort: sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clovisor
  namespace: clovisor-system
  labels:
    app: clovisor
spec:
  # One: runs and their timelines are this pod's.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clovisor
  template:
    metadata:
      labels:
        app: clovisor
    spec:
      serviceAccountName: clovisor
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
      containers:
      - name: clovisor
        image: ${CLOVISOR_IMAGE}
        imagePullPolicy: Always
        args:
        - -identity=substrate
        - -gateway-listen=0.0.0.0:9443
        - -gateway-cert=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - -gateway-client-ca=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - -gateway-peers=spiffe://cluster.local/ns/ate-system/sa/atenet-egress
        - -sandbox-listen=0.0.0.0:9444
        - -sandbox-peers=spiffe://cluster.local/ns/clovisor-system/sa/clovisor-sandbox
        - -substrate-api=dns:///api.ate-system.svc:443
        - -substrate-server-name=api.ate-system.svc
        - -substrate-ca=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - -substrate-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - -substrate-key=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - -policy-dir=/etc/clovisor/policy
        - -runtime-dir=/run/clovisor/agent
        - -state-dir=/var/lib/clovisor/agent
        ports:
        - name: extproc
          containerPort: 9443
        - name: sandbox
          containerPort: 9444
        # Ready once the run API answers, which is after ext_proc listens.
        readinessProbe:
          exec:
            command: ["agentctl", "status"]
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - { name: policy, mountPath: /etc/clovisor/policy, readOnly: true }
        - { name: runtime, mountPath: /run/clovisor }
        - { name: state, mountPath: /var/lib/clovisor }
        - { name: servicedns, mountPath: /run/servicedns.podcert.ate.dev, readOnly: true }
        - { name: podidentity, mountPath: /run/podidentity.podcert.ate.dev, readOnly: true }
      volumes:
      - name: policy
        configMap:
          name: clovisor-policy
      - name: runtime
        emptyDir: {}
      # Timelines. An emptyDir for the demo; a PersistentVolume to keep them.
      - name: state
        emptyDir: {}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
