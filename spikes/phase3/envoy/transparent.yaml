# Phase 3 spike: the transparent listener. Run connects arrive here after
# cgroup/connect4 rewrote them; original_dst recovers the destination through
# SO_ORIGINAL_DST, which the spike's cgroup/getsockopt program answers.
#
#   TLS          tunnelled as CONNECT <SNI>:<original port> into "pipeline",
#                so the proxy resolves the name the client asked for, not the
#                IP it picked. No SNI: CONNECT <original ip>:<port>.
#   plain HTTP   an HTTP connection manager, routed by Host.
#   other TCP    CONNECT <original ip>:<port> into "pipeline".
#
# "pipeline" stands in for Phase 2's CONNECT handling (ext_proc, termination,
# the dynamic forward proxy). It is an internal listener, so only Envoy can
# reach it, and the identity headers tcp_proxy adds can be trusted there.
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 19902 } }
bootstrap_extensions:
- name: envoy.bootstrap.internal_listener
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener
static_resources:
  listeners:
  - name: transparent
    address: { socket_address: { address: 127.0.0.1, port_value: 15001 } }
    additional_addresses:
    - address: { socket_address: { address: "::1", port_value: 15001 } }
    # Server-speaks-first protocols (SSH, SMTP) send nothing for the
    # inspectors to read. Give up after a short wait and fall through to the
    # plain TCP chain instead of closing (the default).
    listener_filters_timeout: 1s
    continue_on_listener_filters_timeout: true
    listener_filters:
    - name: envoy.filters.listener.original_dst
      typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst }
    - name: envoy.filters.listener.tls_inspector
      typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector }
    - name: envoy.filters.listener.http_inspector
      typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector }
    filter_chains:
    # No original destination was stashed (a run connected to this port
    # directly), so the local address is still this listener. Tunnelling it
    # would make Envoy connect to itself, again and again: refuse it.
    - name: self
      filter_chain_match: { destination_port: 15001 }
      filters:
      - name: envoy.filters.network.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
          stat_prefix: self
          rules: { action: DENY, policies: { all: { permissions: [{ any: true }], principals: [{ any: true }] } } }
      - name: envoy.filters.network.tcp_proxy # never reached; a chain must end in a terminal filter
        typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy, stat_prefix: self, cluster: pipeline }
    - name: tls-sni
      filter_chain_match: { transport_protocol: tls, server_names: ["*.com", "*.org", "*.net", "*.test"] }
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tls_sni
          cluster: pipeline
          tunneling_config:
            hostname: "%REQUESTED_SERVER_NAME%:%DOWNSTREAM_LOCAL_PORT%"
            headers_to_add: &ident
            - header: { key: x-clovisor-client, value: "%DOWNSTREAM_REMOTE_ADDRESS%" }
            - header: { key: x-clovisor-orig-dst, value: "%DOWNSTREAM_LOCAL_ADDRESS%" }
            - header: { key: x-clovisor-sni, value: "%REQUESTED_SERVER_NAME%" }
          access_log: &tlog
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format: { text_format_source: { inline_string: "transparent chain=%FILTER_CHAIN_NAME% client=%DOWNSTREAM_REMOTE_ADDRESS% orig=%DOWNSTREAM_LOCAL_ADDRESS% sni=%REQUESTED_SERVER_NAME% bytes=%BYTES_RECEIVED%/%BYTES_SENT% flags=%RESPONSE_FLAGS%\n" } }
    - name: tls-ip
      filter_chain_match: { transport_protocol: tls }
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tls_ip
          cluster: pipeline
          tunneling_config: { hostname: "%DOWNSTREAM_LOCAL_ADDRESS%", headers_to_add: *ident }
          access_log: *tlog
    - name: http
      filter_chain_match: { application_protocols: ["http/1.0", "http/1.1", "h2c"] }
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: transparent_http
          http_protocol_options: { accept_http_10: true }
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format: { text_format_source: { inline_string: "transparent chain=http client=%DOWNSTREAM_REMOTE_ADDRESS% orig=%DOWNSTREAM_LOCAL_ADDRESS% host=%REQ(:AUTHORITY)% %REQ(:METHOD)% %REQ(:PATH)% -> %RESPONSE_CODE% upstream=%UPSTREAM_HOST%\n" } }
          route_config:
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes: [{ match: { prefix: "/" }, route: { cluster: dfp } }]
          http_filters:
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: &dns { name: dfp_cache, dns_lookup_family: V4_PREFERRED }
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
    - name: tcp
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tcp
          cluster: pipeline
          tunneling_config: { hostname: "%DOWNSTREAM_LOCAL_ADDRESS%", headers_to_add: *ident }
          access_log: *tlog

  - name: pipeline
    internal_listener: {}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: pipeline
          upgrade_configs: [{ upgrade_type: CONNECT }]
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format: { text_format_source: { inline_string: "pipeline %REQ(:METHOD)% authority=%REQ(:AUTHORITY)% client=%REQ(X-CLOVISOR-CLIENT)% orig=%REQ(X-CLOVISOR-ORIG-DST)% sni=%REQ(X-CLOVISOR-SNI)% -> %RESPONSE_CODE% upstream=%UPSTREAM_HOST% flags=%RESPONSE_FLAGS%\n" } }
          route_config:
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: { connect_matcher: {} }
                route: { cluster: dfp, upgrade_configs: [{ upgrade_type: CONNECT, connect_config: {} }] }
          http_filters:
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: *dns
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  clusters:
  - name: pipeline
    load_assignment:
      cluster_name: pipeline
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { envoy_internal_address: { server_listener_name: pipeline } } } }] }]
    transport_socket:
      name: envoy.transport_sockets.internal_upstream
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.internal_upstream.v3.InternalUpstreamTransport
        transport_socket: { name: envoy.transport_sockets.raw_buffer, typed_config: { "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer } }
  - name: dfp
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *dns
