# Clovisor kernel matrix (milestone 7.2): every program of the audit BPF
# object loaded on its own, in a VM per kernel (Cilium's little-vm-helper
# images), against the minimum the operator guide documents for it
# (TestBPFLoad). Below a program's minimum its failure is reported, not
# failed: 5.10 is below the 5.12 floor on purpose.
#
# A load test, not the integration suites: it finds helpers, program types
# and verifier limits a kernel lacks. Attaching, and BPF LSM, are not
# exercised here.
name: kernels

on:
  push:
    branches: [master, "phase*"]
    paths:
      - "libclovisor/ebpf/**"
      - "libclovisor/bpf_load_test.go"
      - ".github/workflows/kernels.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: load (${{ matrix.kernel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Dated images, pinned: the action names an image's file by its
        # version less the date, so "-main" tags do not boot.
        kernel: ["5.10", "5.15", "rhel9.7", "6.1", "6.6", "6.12", "6.18"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
      - name: Build the BPF object and the load test
        run: |
          make bpf
          CGO_ENABLED=0 go test -c -o bpfload.test ./libclovisor
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the VM
        uses: cilium/little-vm-helper@v0.0.34
        with:
          test-name: clovisor-bpf-load
          image: kind
          image-version: ${{ matrix.kernel }}-20261021.083220
          host-mount: ./
          cpu: 2
          mem: 4G
          install-dependencies: "true"
          cmd: uname -a
      - name: Load every program
        uses: cilium/little-vm-helper@v0.0.34
        with:
          provision: "false"
          cmd: |
            cd /host && CLOVISOR_BPF_LOAD=/host/libclovisor/ebpf/agent_audit.o ./bpfload.test -test.run TestBPFLoad -test.v
