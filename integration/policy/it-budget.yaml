kind: AgentProfile
metadata: { name: it-budget }
spec:
  mode: enforce
  egress:
    default: deny
    rules:
      - name: llm
        to: { fqdn: ["origin.test"], ports: [443] }
        http: { methods: [POST], paths: ["/v1/messages", "/v1/chat/completions"] }
        budget: { tokens: 1000, cost_usd: 1 }
        action: allow
