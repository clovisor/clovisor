kind: AgentProfile
metadata: { name: it-ask }
spec:
  mode: enforce
  egress:
    default: deny
    rules:
      - name: read
        to: { fqdn: ["origin.test"], ports: [443] }
        http: { methods: [GET], paths: ["/allowed"] }
        action: ask
        message: "The agent wants to read /allowed."
      - name: echo
        to: { fqdn: ["origin.test"], ports: [443] }
        http: { methods: [POST], paths: ["/echo"] }
        action: ask
        ask: { timeout: 2s, on_timeout: allow }
      - { name: mcp, to: { fqdn: ["mcp.test"], ports: [443] }, action: allow }
  mcp:
    default: deny
    servers:
      - name: origin-mcp
        match: { fqdn: "mcp.test" }
        tools: { allow: ["summarize"] }
    # A sampling request from the server waits for a person (milestone 5.5).
    sampling: { action: ask, message: "The MCP server wants to call the model." }
