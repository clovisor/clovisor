# Phase 7.0 spike: real agents through the explicit proxy, against the
# mock model (CLOVISOR_IT_AGENTS). Audit, default deny: everything an agent
# reaches besides the mock and the origin is recorded as would-deny.
kind: AgentProfile
metadata: { name: it-agents }
spec:
  mode: audit
  egress:
    default: deny
    rules:
      - { name: mock-model, to: { fqdn: ["origin.test"], ports: [443, 8443] }, action: allow }
